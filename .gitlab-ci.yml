# Daily catalog plus tagged Steam plugin releases.
# Schedule in GitLab: CI/CD → Schedules → cron `0 4 * * *` (UTC), target branch main.
# Optional CI/CD variables: HUBCAP_API_KEY, CATALOG_PUSH_TOKEN (project access token with write_repository)

stages:
  - catalog
  - build
  - package
  - verify
  - release
  - publish

variables:
  GIT_DEPTH: "1"

.update-catalog:
  stage: catalog
  image: python:3.12-slim
  timeout: 3h
  cache:
    key: depotkeys
    paths:
      - catalog/.cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git ca-certificates
  script:
    - python tools/build_manifest_catalog.py --incremental --steam-dates --workers 32 --verbose
    - |
      if git diff --quiet -- catalog/games-manifest-catalog.json config/games-manifest-catalog.json; then
        echo "Catalog unchanged"
        exit 0
      fi
      git config user.email "ci@gitlab.com"
      git config user.name "Steam Catalog Bot"
      git add catalog/games-manifest-catalog.json config/games-manifest-catalog.json
      COUNT=$(python -c "import json; print(json.load(open('catalog/games-manifest-catalog.json'))['count'])")
      git commit -m "chore(catalog): refresh installable manifests ($COUNT games)"
      if [ -n "${CATALOG_PUSH_TOKEN:-}" ]; then
        git push "https://oauth2:${CATALOG_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
      elif [ -n "${CI_JOB_TOKEN:-}" ] && [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        # Prefer project token; job token push needs "CI job token allow push" in project settings.
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}" || true
      else
        echo "Set CATALOG_PUSH_TOKEN (write_repository) to push catalog commits"
        exit 1
      fi
  artifacts:
    paths:
      - catalog/games-manifest-catalog.json
    expire_in: 7 days

update-catalog-scheduled:
  extends: .update-catalog
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

update-catalog-manual:
  extends: .update-catalog
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true

# Full rebuild (all appids) — run manually when needed
rebuild-catalog-full:
  extends: .update-catalog
  timeout: 5h
  script:
    - python tools/build_manifest_catalog.py --steam-dates --workers 32 --verbose
    - |
      git config user.email "ci@gitlab.com"
      git config user.name "Steam Catalog Bot"
      git add catalog/games-manifest-catalog.json config/games-manifest-catalog.json
      COUNT=$(python -c "import json; print(json.load(open('catalog/games-manifest-catalog.json'))['count'])")
      git commit -m "chore(catalog): full rebuild installable manifests ($COUNT games)" || exit 0
      if [ -n "${CATALOG_PUSH_TOKEN:-}" ]; then
        git push "https://oauth2:${CATALOG_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
      else
        echo "Set CATALOG_PUSH_TOKEN to push"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

build:linux:
  stage: build
  # 22.04 keeps glibc/OpenSSL aligned with the Arachnel AppImage bundle (OPENSSL_3.0).
  # Building on 24.04 + host curl breaks load on Arch/CachyOS under the AppImage.
  image: ubuntu:22.04
  tags:
    - linux
  timeout: 2h
  before_script:
    - apt-get update
    # curl CLI != libcurl headers; depotkit needs libcurl + OpenSSL on Linux.
    - apt-get install -y --no-install-recommends ca-certificates cmake curl file g++ git ninja-build p7zip-full pkg-config unrar python3 python3-pip python3-venv unzip zip libcurl4-openssl-dev libssl-dev zlib1g-dev patchelf
  script:
    - bash scripts/ci/build-plugin.sh
  artifacts:
    name: steam-linux-$CI_COMMIT_TAG
    paths:
      - dist/linux/steam.arach
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/

build:windows:
  stage: build
  # Home PC shell runner. Do not leave untagged - Windows would steal linux jobs.
  tags:
    - windows
  timeout: 2h
  before_script:
    # Runner is LocalSystem: user PATH / choco are often missing. Prefer known installs.
    - |
      $ErrorActionPreference = 'Stop'
      if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
        $candidates = @(
          'C:\Users\kiril\AppData\Local\Programs\Python\Python311\python.exe',
          'C:\Users\kiril\AppData\Local\Programs\Python\Python312\python.exe',
          'C:\Program Files\Python311\python.exe',
          'C:\Program Files\Python312\python.exe'
        )
        $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $found) { throw 'python not found for LocalSystem runner. Install Python for all users or add it to Machine PATH.' }
        $dir = Split-Path -Parent $found
        $env:Path = "$dir;$(Join-Path $dir 'Scripts');$env:Path"
      }
      if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
        throw '7-Zip not found at C:\Program Files\7-Zip\7z.exe'
      }
      python --version
      if (-not $env:QT_INSTALL_DIR) { $env:QT_INSTALL_DIR = 'D:\Qt' }
      if (-not $env:QT_VERSION) { $env:QT_VERSION = '6.11.1' }
      if (-not $env:ARACHNEL_SDK_DIR -and (Test-Path 'D:\Work\Arachnel\cmake\ArachnelPluginSdk.cmake')) {
        $env:ARACHNEL_SDK_DIR = 'D:\Work\Arachnel'
      }
  script:
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/build-plugin.ps1
  artifacts:
    name: steam-windows-$CI_COMMIT_TAG
    paths:
      - dist/windows/steam.arach
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/

package:universal:
  stage: package
  image: ubuntu:24.04
  tags:
    - linux
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends zip unzip
  script:
    - bash scripts/ci/merge-universal-arach.sh
  artifacts:
    name: steam-universal-$CI_COMMIT_TAG
    paths:
      - dist/universal/steam.arach
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/

.verify-linux-runtime:
  stage: verify
  tags:
    - linux
  needs:
    - job: package:universal
      artifacts: true
  script:
    - |
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update
        apt-get install -y --no-install-recommends bash binutils patchelf python3 unzip
      elif command -v dnf >/dev/null 2>&1; then
        dnf install -y bash binutils patchelf python3 unzip
      elif command -v pacman >/dev/null 2>&1; then
        pacman -Sy --noconfirm bash binutils patchelf python unzip
      fi
    - rm -rf dist/universal/.verify
    - mkdir -p dist/universal/.verify
    - unzip -q dist/universal/steam.arach -d dist/universal/.verify
    - |
      ROOT="$(find dist/universal/.verify -name plugin.json -printf '%h\n' | head -n 1)"
      test -n "${ROOT}"
      bash scripts/ci/check-linux-runtime.sh "${ROOT}/libsteamidra_plugin.so" "${ROOT}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/

verify:ubuntu:
  extends: .verify-linux-runtime
  image: ubuntu:24.04

verify:fedora:
  extends: .verify-linux-runtime
  image: fedora:40

verify:arch:
  extends: .verify-linux-runtime
  image: archlinux:latest

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - linux
  needs:
    - job: package:universal
      artifacts: true
    - job: verify:ubuntu
    - job: verify:fedora
    - job: verify:arch
  before_script:
    - apk add --no-cache curl jq
  script:
    - cp dist/universal/steam.arach steam.arach
    - |
      cat > release-notes.md <<EOF
      # Steam plugin ${CI_COMMIT_TAG}

      Install in Arachnel: **Settings → Plugins** → \`steam.arach\`.

      Universal bundle for Windows and Linux.
      Internal plugin id remains \`steamidra\` for settings and upgrade compatibility.
      Requires Arachnel plugin API v4 (JSON catalog). Arachnel v0.1.34+ picks this build;
      older launchers keep installing the last API v3 package from sourcelist history.
      EOF
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file steam.arach \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/steam/${CI_COMMIT_TAG}/steam.arach"
    - |
      PACKAGE_ID="$(curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_type=generic&package_name=steam&package_version=${CI_COMMIT_TAG}" \
        | jq -r '.[0].id')"
      FILE_ID="$(curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}/package_files" \
        | jq -r '.[0].id')"
      DOWNLOAD_URL="${CI_PROJECT_URL}/-/package_files/${FILE_ID}/download"
      echo "DOWNLOAD_URL=${DOWNLOAD_URL}" > download.env
      # Retags reuse the same tag name - drop prior Release so create is idempotent.
      curl -fsS --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" \
        >/dev/null 2>&1 || true
      release-cli create \
        --name "Steam plugin ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "$(cat release-notes.md)" \
        --assets-link "[{\"name\":\"steam.arach\",\"url\":\"${DOWNLOAD_URL}\",\"link_type\":\"package\"}]"
  artifacts:
    reports:
      dotenv: download.env
    paths:
      - steam.arach
      - download.env
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/

publish-sourcelist:
  stage: publish
  needs:
    - job: release
      artifacts: true
  # Bridge job (no runner). Downstream sourcelist downloads the package and pushes plugins.json.
  variables:
    INGEST_DOWNLOAD_URL: $DOWNLOAD_URL
    INGEST_ARACH_NAME: steam.arach
    INGEST_TAG: $CI_COMMIT_TAG
    INGEST_MIN_ARACHNEL: "0.1.34"
    INGEST_MAX_ARACHNEL: ""
    INGEST_ABI_TOKEN: "api=4"
  trigger:
    project: BadKiko/arachnel-plugins-sourcelist
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/
