# Runs on the schedule below and from Actions -> Catalog -> Run workflow.
# Daily refresh of catalog/games-manifest-catalog.json (installable manifests only).
# Optional repository secret: HUBCAP_API_KEY.

name: Catalog

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Full rebuild (all appids) instead of incremental'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache depot keys
        uses: actions/cache@v4
        with:
          path: catalog/.cache
          key: depotkeys-${{ github.run_id }}
          restore-keys: depotkeys-

      - name: Rebuild catalog
        env:
          HUBCAP_API_KEY: ${{ secrets.HUBCAP_API_KEY }}
          FULL: ${{ github.event.inputs.full_rebuild }}
        run: |
          if [[ "${FULL}" == "true" ]]; then
            python tools/build_manifest_catalog.py --steam-dates --workers 32 --verbose
          else
            python tools/build_manifest_catalog.py --incremental --steam-dates --workers 32 --verbose
          fi

      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- catalog/games-manifest-catalog.json config/games-manifest-catalog.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "Steam Catalog Bot"
          git add catalog/games-manifest-catalog.json config/games-manifest-catalog.json
          COUNT=$(python -c "import json; print(json.load(open('catalog/games-manifest-catalog.json'))['count'])")
          git commit -m "chore(catalog): refresh installable manifests ($COUNT games)"
          git push origin HEAD:master
