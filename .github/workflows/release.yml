# Build and publish a universal steam.arach (Windows + Linux).
#
#   git tag v0.6.22 && git push origin v0.6.22
# or Actions -> Release -> Run workflow (version = 0.6.22).
#
# Toolchain is locked to Arachnel release.yml - edit scripts/ci/launcher-toolchain.env.
# The sourcelist (BadKikoSecond/arachnel_plugins_sourcelist) also polls this repo's releases,
# so publishing works without any secret; SOURCELIST_DISPATCH_TOKEN only makes it instant.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Dry run on PRs that touch the build: builds, merges and verifies, never publishes.
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/ci/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'tools/fetch_third_party.*'
      - 'plugin.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version without "v" (e.g. 0.6.22)'
        required: true
        type: string
      publish_release:
        description: 'Create the GitHub Release (off = build + verify only, nothing is published)'
        required: false
        default: true
        type: boolean
      notify_sourcelist:
        description: 'Notify the sourcelist after the release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            TAG="v${INPUT_VERSION#v}"
          elif [[ "${EVENT}" == "pull_request" ]]; then
            TAG="v$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            TAG="${REF_NAME}"
          else
            echo "Need a tag or a version input" >&2
            exit 1
          fi
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build-linux:
    needs: prepare
    # 22.04 keeps glibc/OpenSSL aligned with the Arachnel AppImage bundle (OPENSSL_3.0).
    # Building on 24.04 + host curl breaks load on Arch/CachyOS under the AppImage.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          # curl CLI != libcurl headers; depotkit needs libcurl + OpenSSL on Linux.
          sudo apt-get install -y --no-install-recommends \
            ca-certificates cmake curl file g++ git ninja-build p7zip-full pkg-config \
            python3 python3-pip python3-venv unzip zip unrar \
            libcurl4-openssl-dev libssl-dev zlib1g-dev patchelf libglib2.0-0

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            .ci/qt
            .ci/aqt-venv
          key: qt-linux-${{ hashFiles('scripts/ci/launcher-toolchain.env') }}

      - name: Build plugin
        run: bash scripts/ci/build-plugin.sh

      # verify jobs run in bare distro containers: hand them just the Qt libs
      # the plugin links against (check-linux-runtime.sh looks under .ci/qt/).
      - name: Stage Qt runtime for verify
        run: |
          set -euo pipefail
          QT_LIB="$(ls -d "${PWD}"/.ci/qt/*/gcc_64/lib)"
          mkdir -p qt-runtime
          for f in libQt6Core.so.6 libQt6Network.so.6; do
            cp -aL "${QT_LIB}/${f}" qt-runtime/
          done
          for f in libQt6Core.so.6 libQt6Network.so.6; do
            LD_LIBRARY_PATH="${QT_LIB}" ldd "qt-runtime/${f}" \
              | awk -v qt="${QT_LIB}/" 'index($3, qt) == 1 { print $3 }' \
              | while read -r dep; do cp -aL "${dep}" qt-runtime/; done
          done
          ls -lh qt-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: steam-linux
          path: dist/linux/steam.arach
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: qt-runtime
          path: qt-runtime
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            .ci/qt
            .ci/aqt-venv
          key: qt-windows-${{ hashFiles('scripts/ci/launcher-toolchain.env') }}

      - name: Build plugin
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/build-plugin.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: steam-windows
          path: dist/windows/steam.arach
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - uses: actions/download-artifact@v4
        with:
          name: steam-linux
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: steam-windows
          path: dist/windows

      - name: Merge universal bundle
        run: bash scripts/ci/merge-universal-arach.sh

      - uses: actions/upload-artifact@v4
        with:
          name: steam-universal
          path: dist/universal/steam.arach
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: [build-linux, package]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'fedora:40', 'archlinux:latest']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: steam-universal
          path: dist/universal

      - uses: actions/download-artifact@v4
        with:
          name: qt-runtime
          path: .ci/qt/lib

      - name: Check Linux runtime in ${{ matrix.image }}
        run: |
          docker run --rm -v "${PWD}:/w" -w /w "${{ matrix.image }}" bash -ec '
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends bash binutils patchelf python3 unzip libglib2.0-0
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y bash binutils patchelf python3 unzip glib2
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm bash binutils patchelf python unzip glib2
            fi
            rm -rf dist/universal/.verify
            mkdir -p dist/universal/.verify
            unzip -q dist/universal/steam.arach -d dist/universal/.verify
            ROOT="$(find dist/universal/.verify -name plugin.json -printf "%h\n" | head -n 1)"
            test -n "${ROOT}"
            bash scripts/ci/check-linux-runtime.sh "${ROOT}/libsteamidra_plugin.so" "${ROOT}"
          '

  release:
    needs: [prepare, verify]
    if: github.event_name == 'push' || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      download_url: ${{ steps.publish.outputs.download_url }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: steam-universal
          path: dist/universal

      - name: Publish GitHub Release
        id: publish
        run: |
          cat > release-notes.md <<EOF
          # Steam plugin ${TAG}

          Install in Arachnel: **Settings → Plugins** → \`steam.arach\`.

          Universal bundle for Windows and Linux.
          Internal plugin id remains \`steamidra\` for settings and upgrade compatibility.
          Requires Arachnel plugin API v4 (JSON catalog). Arachnel v0.1.34+ picks this build;
          older launchers keep installing the last API v3 package from sourcelist history.
          EOF

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/universal/steam.arach --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/universal/steam.arach \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Steam plugin ${TAG}" \
              --notes-file release-notes.md
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/steam.arach"
          echo "download_url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "Published ${URL}"

  notify-sourcelist:
    needs: [prepare, release]
    if: github.event_name == 'push' || github.event.inputs.notify_sourcelist == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch sourcelist ingest
        env:
          DISPATCH_TOKEN: ${{ secrets.SOURCELIST_DISPATCH_TOKEN }}
          DOWNLOAD_URL: ${{ needs.release.outputs.download_url }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ -z "${DISPATCH_TOKEN}" ]]; then
            echo "::notice::SOURCELIST_DISPATCH_TOKEN is not set - the sourcelist picks this release up on its next poll (every 30 min) or via Actions -> Sources -> Run workflow."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/BadKikoSecond/arachnel_plugins_sourcelist/dispatches \
            -d "$(jq -nc --arg url "${DOWNLOAD_URL}" --arg tag "${TAG}" \
              '{event_type:"plugin-release",client_payload:{url:$url,arach:"steam.arach",tag:$tag,min_arachnel:"0.1.34",max_arachnel:"",abi_token:"api=4"}}')"
